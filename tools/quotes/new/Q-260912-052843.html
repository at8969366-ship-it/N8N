<style>
  :root{
    --blue:#2AA9DE;
    --navy:#141B33;
    --grey:#F4F5F7;
  }
  * { box-sizing:border-box; }
  body { font-family: Arial, Helvetica, sans-serif; color:#1a1a1a; margin:0; padding:0; font-size:13px; }
  .page { max-width:900px; margin:0 auto; padding:0 0 0 0; }

  .header { position:relative; padding:36px 48px 10px; overflow:hidden; }
  .header::after{
    content:""; position:absolute; top:0; right:0; width:38%; height:70px;
    background:var(--blue); clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 100%);
  }
  .logo { height:64px; display:block; }

  h1.title { font-size:34px; font-weight:800; color:var(--blue); margin:18px 48px 22px; letter-spacing:1px; }

  .meta { display:flex; justify-content:space-between; margin:0 48px 18px; gap:24px; }
  .meta .left, .meta .right { font-size:13px; line-height:1.9; }
  .meta .left b, .meta .right b { color:#000; }
  .meta .right { text-align:right; color:#333; }
  .meta .right .company { font-weight:bold; color:#000; font-size:13px; }

  .scope { margin:0 48px 18px; font-weight:bold; font-size:13.5px; }

  table.items { width:calc(100% - 96px); margin:0 48px; border-collapse:collapse; }
  table.items thead th {
    background:var(--blue); color:#fff; font-size:12.5px; text-transform:uppercase;
    padding:10px 14px; text-align:left; letter-spacing:.5px;
  }
  table.items thead th.num, table.items tbody td.num { text-align:center; }
  table.items tbody td {
    padding:12px 14px; vertical-align:top; border-bottom:1px solid #e6e6e6; font-size:13px; line-height:1.6;
  }
  table.items tbody tr.alt td { background:var(--grey); }
  table.items tbody td.price { text-align:center; font-weight:bold; vertical-align:middle; }
  table.items tbody tr.banner td {
    background:var(--blue); color:#fff; font-weight:bold; text-align:center; padding:9px; font-size:13px;
  }
  table.items tfoot td { padding:14px; border:none; }
  table.items tfoot .total-label { text-align:right; font-weight:bold; font-size:14px; padding-right:16px; }
  table.items tfoot .total-value { background:var(--blue); color:#fff; font-weight:bold; text-align:center; font-size:14px; }

  .footer { margin-top:40px; background:var(--navy); color:#fff; text-align:center; padding:16px; font-size:13px; letter-spacing:.5px; }
</style>
